<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ludo Online</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle, #2d3748 0%, #1a202c 100%);
      margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh;
      color: #1a202c;
    }

    .card {
      background: #ffffff; padding: 2.2rem; border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      width: 100%; max-width: 420px;
    }

    h2, h3 { margin-top: 0; text-align: center; color: #0f172a; }
    .form-group { margin-bottom: 1.2rem; display: flex; flex-direction: column; }
    label { font-weight: 700; font-size: 0.9rem; margin-bottom: 6px; }
    input, select, button { padding: 12px; font-size: 1rem; border-radius: 8px; border: 1px solid #cbd5e1; outline: none; }
    
    button {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
      color: white; border: none; cursor: pointer; font-weight: 700;
      box-shadow: 0 4px 10px rgba(37,99,235,0.4);
      transition: transform 0.1s;
    }
    button:active { transform: translateY(2px); }
    button:disabled { background: #64748b !important; box-shadow: none !important; cursor: not-allowed; }

    .hidden { display: none !important; }
    .invite-box { background: #f8fafc; padding: 10px; border-radius: 6px; font-family: monospace; font-size: 0.85rem; border: 1px dashed #94a3b8; word-break: break-all; margin: 10px 0; }
    ul { list-style: none; padding: 0; }
    li { padding: 8px 12px; background: #f1f5f9; border-radius: 6px; margin-bottom: 6px; display: flex; justify-content: space-between; align-items: center; }

    #game-container { display: flex; flex-direction: column; align-items: center; gap: 15px; }

    .status-panel {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      padding: 10px 24px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      gap: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    /* Zar 3D */
    .dice-container { perspective: 600px; width: 52px; height: 52px; cursor: pointer; }
    .dice {
      width: 52px; height: 52px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 5px 0 #cbd5e1, 0 8px 15px rgba(0,0,0,0.3);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 5px;
      box-sizing: border-box;
      transition: transform 0.5s cubic-bezier(0.2, 0.8, 0.3, 1);
    }
    .dice.rolling {
      transform: rotateX(720deg) rotateY(1080deg) scale(1.1);
    }
    .dot {
      background: #1e293b; border-radius: 50%; width: 8px; height: 8px;
      margin: auto; visibility: hidden;
    }

    /* Tabla de joc conform imaginii clasice */
    .board-wrapper {
      background: #e2b980;
      padding: 14px;
      border-radius: 16px;
      border: 4px solid #b38548;
      box-shadow: 0 25px 50px rgba(0,0,0,0.6);
    }
    .game-board {
      display: grid;
      grid-template-columns: repeat(15, 32px);
      grid-template-rows: repeat(15, 32px);
      background: #000;
      gap: 1px;
      border: 2px solid #000;
    }

    .cell {
      background: #ffffff;
      display: flex; justify-content: center; align-items: center;
      position: relative;
    }

    .cell-blue { background: #0070ba !important; }
    .cell-red { background: #ea580c !important; }
    .cell-yellow { background: #eab308 !important; }
    .cell-green { background: #16a34a !important; }
    .cell-wood { background: #e2b980 !important; border: none; }
    .cell-disabled { background: #94a3b8 !important; opacity: 0.4; }

    .base-spot {
      width: 22px; height: 22px; background: #ffffff;
      border-radius: 50%; display: flex; justify-content: center; align-items: center;
      border: 1px solid rgba(0,0,0,0.2);
    }

    /* Pioni */
    .pawn {
      width: 22px; height: 22px;
      border-radius: 50%;
      position: relative;
      box-shadow: 0 4px 6px rgba(0,0,0,0.4);
      z-index: 5;
    }
    .pawn::after {
      content: ''; position: absolute; top: 2px; left: 4px;
      width: 5px; height: 4px; border-radius: 50%;
      background: rgba(255,255,255,0.7);
    }

    .pawn-Blue { background: radial-gradient(circle at 35% 35%, #38bdf8, #0070ba); border: 2px solid #bae6fd; }
    .pawn-Red { background: radial-gradient(circle at 35% 35%, #fb923c, #ea580c); border: 2px solid #fed7aa; }
    .pawn-Yellow { background: radial-gradient(circle at 35% 35%, #fde047, #ca8a04); border: 2px solid #fef08a; }
    .pawn-Green { background: radial-gradient(circle at 35% 35%, #4ade80, #16a34a); border: 2px solid #bbf7d0; }

    .pawn-selectable {
      cursor: pointer !important;
      animation: pulseHighlight 0.7s infinite alternate;
      border-color: #ffffff !important;
    }

    @keyframes pulseHighlight {
      0% { transform: scale(1.1); box-shadow: 0 0 4px 2px #fff; }
      100% { transform: scale(1.3); box-shadow: 0 0 12px 4px #facc15; }
    }
  </style>
</head>
<body>

  <!-- Menu View -->
  <div class="card" id="menu-view">
    <h2>Ludo Online</h2>
    <div class="form-group">
      <label>Your Name:</label>
      <input type="text" id="player-name" placeholder="Enter your name" autofocus />
    </div>
    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">
    <h3>Create Match</h3>
    <div class="form-group">
      <label>Number of Players:</label>
      <select id="max-players">
        <option value="2">2 Players (Blue vs Yellow)</option>
        <option value="3">3 Players (Blue, Red, Yellow)</option>
        <option value="4" selected>4 Players (All Colors)</option>
      </select>
      <button onclick="createRoom()">Create Room</button>
    </div>
    <hr style="border: 0; border-top: 1px solid #e2e8f0; margin: 15px 0;">
    <h3>Join Game</h3>
    <div class="form-group">
      <input 
        type="text" 
        id="room-code-input" 
        placeholder="4-digit code" 
        maxlength="4" 
        oninput="this.value = this.value.replace(/[^0-9]/g, '');" 
      />
      <button onclick="joinRoom()">Join Game</button>
    </div>
  </div>

  <!-- Waiting Room -->
  <div class="card hidden" id="lobby-view">
    <h2>Game Lobby</h2>
    <p style="font-size: 0.9rem;">Invite Link:</p>
    <div class="invite-box" id="invite-link"></div>
    <p>Room Code: <strong id="display-code" style="font-size: 1.3rem; letter-spacing: 2px;"></strong></p>
    <ul id="players-list"></ul>
    <button id="start-btn" class="hidden" onclick="startGame()">Start Match</button>
  </div>

  <!-- Board Screen -->
  <div id="game-container" class="hidden">
    <div class="status-panel">
      <div>Turn: <strong id="turn-txt">-</strong></div>
      
      <div class="dice-container" onclick="rollDice()">
        <div class="dice" id="dice-cube">
          <div class="dot" id="d1"></div><div class="dot" id="d2"></div><div class="dot" id="d3"></div>
          <div class="dot" id="d4"></div><div class="dot" id="d5"></div><div class="dot" id="d6"></div>
          <div class="dot" id="d7"></div><div class="dot" id="d8"></div><div class="dot" id="d9"></div>
        </div>
      </div>

      <button id="roll-btn" onclick="rollDice()">Roll Dice</button>
    </div>

    <div class="board-wrapper">
      <div class="game-board" id="board"></div>
    </div>
  </div>

  <script>
    const socket = io();
    let currentRoomCode = null;
    let myColor = null;
    let currentTurnColor = null;
    let activeColorsList = ['Blue', 'Red', 'Yellow', 'Green'];

    // --- Web Audio API (Sinteza audio nativa) ---
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playDiceSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      for (let i = 0; i < 5; i++) {
        setTimeout(() => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150 + Math.random() * 200, audioCtx.currentTime);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.08);
        }, i * 60);
      }
    }

    function playMoveSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(320, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(550, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.12);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.12);
    }

    function playCaptureSound() {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(450, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(120, audioCtx.currentTime + 0.25);
      gain.gain.setValueAtTime(0.35, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.25);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.25);
    }

    // --- Autocompletare automata cod din URL ---
    const urlParams = new URLSearchParams(window.location.search);
    const roomParam = urlParams.get('room');
    if (roomParam) {
      const input = document.getElementById('room-code-input');
      input.value = roomParam;
      document.getElementById('player-name').focus();
    }

    // Traseul complet 0-39 (Clockwise) conform desenului tau
    const TRACK_COORDS = [
      /* 0: Start Blue */ [6, 1], 
      [6, 2], [6, 3], [6, 4], [6, 5],
      [5, 6], [4, 6], [3, 6], [2, 6], [1, 6], 
      [0, 6], 
      /* 10: Start Red */ [1, 8], 
      [2, 8], [3, 8], [4, 8], [5, 8],
      [6, 9], [6, 10], [6, 11], [6, 12], 
      /* 20: Start Yellow */ [8, 13], 
      [8, 12], [8, 11], [8, 10], [8, 9],
      [9, 8], [10, 8], [11, 8], [12, 8], [13, 8], 
      [14, 8], 
      /* 30: Start Green */ [13, 6], 
      [12, 6], [11, 6], [10, 6], [9, 6],
      [8, 5], [8, 4], [8, 3], [8, 2], [8, 1], 
      [7, 0]
    ];

    // Casutele de sosire ("Casa")
    const HOME_TRACK_COORDS = {
      Blue: [[7, 1], [7, 2], [7, 3], [7, 4]],
      Red: [[1, 7], [2, 7], [3, 7], [4, 7]],
      Yellow: [[7, 13], [7, 12], [7, 11], [7, 10]],
      Green: [[13, 7], [12, 7], [11, 7], [10, 7]]
    };

    const START_OFFSETS = { Blue: 0, Red: 10, Yellow: 20, Green: 30 };

    const BASE_COORDS = {
      Blue: [[2, 2], [2, 3], [3, 2], [3, 3]],
      Red: [[2, 11], [2, 12], [3, 11], [3, 12]],
      Yellow: [[11, 11], [11, 12], [12, 11], [12, 12]],
      Green: [[11, 2], [11, 3], [12, 2], [12, 3]]
    };

    const DICE_PATTERNS = {
      1: [5],
      2: [1, 9],
      3: [1, 5, 9],
      4: [1, 3, 7, 9],
      5: [1, 3, 5, 7, 9],
      6: [1, 3, 4, 6, 7, 9]
    };

    function createRoom() {
      const playerName = document.getElementById('player-name').value.trim();
      const maxPlayers = document.getElementById('max-players').value;
      if (!playerName) return alert('Please enter your name!');
      socket.emit('create_room', { playerName, maxPlayers });
    }

    function joinRoom() {
      const playerName = document.getElementById('player-name').value.trim();
      const roomCode = document.getElementById('room-code-input').value.trim();
      if (!playerName) return alert('Please enter your name!');
      if (roomCode.length !== 4) return alert('Please enter a valid 4-digit code!');
      socket.emit('join_room', { playerName, roomCode });
    }

    function startGame() {
      socket.emit('start_game', currentRoomCode);
    }

    function rollDice() {
      if (myColor !== currentTurnColor) return;
      socket.emit('roll_dice', currentRoomCode);
    }

    function movePawn(idx) {
      if (myColor !== currentTurnColor) return;
      socket.emit('move_pawn', { roomCode: currentRoomCode, pawnIndex: idx });
    }

    socket.on('room_created', ({ roomCode, room }) => {
      myColor = room.players[0].color;
      enterLobby(roomCode, room.players);
      document.getElementById('start-btn').classList.remove('hidden');
    });

    socket.on('joined_successfully', ({ roomCode, room }) => {
      myColor = room.players[room.players.length - 1].color;
      enterLobby(roomCode, room.players);
    });

    socket.on('update_players', (players) => {
      const list = document.getElementById('players-list');
      list.innerHTML = '';
      players.forEach(p => {
        const li = document.createElement('li');
        li.innerHTML = `<strong>${p.name}</strong> <span style="color:${getColorHex(p.color)}">${p.color}</span>`;
        list.appendChild(li);
      });
    });

    socket.on('game_started', ({ turnColor, pawns, activeColors }) => {
      document.getElementById('lobby-view').classList.add('hidden');
      document.getElementById('game-container').classList.remove('hidden');
      activeColorsList = activeColors;
      setupBoard(activeColors);
      setTurn(turnColor);
      renderPawns(pawns, []);
      displayDice(1);
    });

    socket.on('dice_rolled', ({ dice, turnColor, movableIndices }) => {
      playDiceSound();
      animateDice(dice);
      document.getElementById('roll-btn').disabled = true;

      if (myColor === turnColor) {
        renderPawns(lastPawnsState, movableIndices);
      }
    });

    socket.on('pawn_moved_sound', ({ captured }) => {
      if (captured) {
        playCaptureSound();
      } else {
        playMoveSound();
      }
    });

    let lastPawnsState = {};
    socket.on('state_update', ({ pawns, turnColor }) => {
      lastPawnsState = pawns;
      setTurn(turnColor);
      renderPawns(pawns, []);
    });

    socket.on('error_message', (msg) => {
      alert(msg);
    });

    function setTurn(color) {
      currentTurnColor = color;
      const turnTxt = document.getElementById('turn-txt');
      turnTxt.innerText = color;
      turnTxt.style.color = getColorHex(color);
      document.getElementById('roll-btn').disabled = (myColor !== color);
    }

    function enterLobby(code, players) {
      currentRoomCode = code;
      document.getElementById('menu-view').classList.add('hidden');
      document.getElementById('lobby-view').classList.remove('hidden');
      document.getElementById('invite-link').innerText = `${window.location.origin}?room=${code}`;
      document.getElementById('display-code').innerText = code;
    }

    function animateDice(value) {
      const dice = document.getElementById('dice-cube');
      dice.classList.add('rolling');
      setTimeout(() => {
        displayDice(value);
        dice.classList.remove('rolling');
      }, 500);
    }

    function displayDice(value) {
      for (let i = 1; i <= 9; i++) {
        document.getElementById(`d${i}`).style.visibility = 'hidden';
      }
      const activeDots = DICE_PATTERNS[value] || [];
      activeDots.forEach(idx => {
        document.getElementById(`d${idx}`).style.visibility = 'visible';
      });
    }

    function setupBoard(activeColors) {
      const board = document.getElementById('board');
      board.innerHTML = '';

      for (let r = 0; r < 15; r++) {
        for (let c = 0; c < 15; c++) {
          const cell = document.createElement('div');
          cell.className = 'cell';
          cell.id = `cell-${r}-${c}`;

          const isCornerArea = (r < 6 && c < 6) || (r < 6 && c > 8) || (r > 8 && c > 8) || (r > 8 && c < 6);

          if (isCornerArea) {
            cell.classList.add('cell-wood');

            const isBaseSpot = (
              ((r===2||r===3) && (c===2||c===3)) ||
              ((r===2||r===3) && (c===11||c===12)) ||
              ((r===11||r===12) && (c===11||c===12)) ||
              ((r===11||r===12) && (c===2||c===3))
            );

            if (isBaseSpot) {
              const spot = document.createElement('div');
              spot.className = 'base-spot';
              cell.appendChild(spot);
            }
          }

          // Casutele de START
          if (r === 6 && c === 1) cell.classList.add('cell-blue');
          if (r === 1 && c === 8) cell.classList.add('cell-red');
          if (r === 8 && c === 13) cell.classList.add('cell-yellow');
          if (r === 13 && c === 6) cell.classList.add('cell-green');

          // Calea de acces in CASA
          if (r === 7 && c >= 1 && c <= 4) cell.classList.add('cell-blue');
          if (c === 7 && r >= 1 && r <= 4) cell.classList.add('cell-red');
          if (r === 7 && c >= 10 && c <= 13) cell.classList.add('cell-yellow');
          if (c === 7 && r >= 10 && r <= 13) cell.classList.add('cell-green');

          // Triunghiurile centrale
          if (r === 7 && c === 6) cell.classList.add('cell-blue');
          if (r === 6 && c === 7) cell.classList.add('cell-red');
          if (r === 7 && c === 8) cell.classList.add('cell-yellow');
          if (r === 8 && c === 7) cell.classList.add('cell-green');

          board.appendChild(cell);
        }
      }
    }

    function renderPawns(pawns, movableIndices = []) {
      if (!pawns) return;
      lastPawnsState = pawns;
      document.querySelectorAll('.pawn').forEach(el => el.remove());

      for (const color in pawns) {
        if (!activeColorsList.includes(color)) continue;

        pawns[color].forEach((pos, idx) => {
          let coords = null;
          if (pos === -1) {
            coords = BASE_COORDS[color][idx];
          } else if (pos < 40) {
            const globalPos = (pos + START_OFFSETS[color]) % 40;
            coords = TRACK_COORDS[globalPos];
          } else if (pos >= 40 && pos <= 43) {
            coords = HOME_TRACK_COORDS[color][pos - 40];
          }

          if (coords) {
            const cell = document.getElementById(`cell-${coords[0]}-${coords[1]}`);
            if (cell) {
              const p = document.createElement('div');
              p.className = `pawn pawn-${color}`;

              if (color === myColor && movableIndices.includes(idx)) {
                p.classList.add('pawn-selectable');
                p.onclick = () => movePawn(idx);
              }

              const spot = cell.querySelector('.base-spot');
              if (spot) {
                spot.appendChild(p);
              } else {
                cell.appendChild(p);
              }
            }
          }
        });
      }
    }

    function getColorHex(color) {
      switch(color) {
        case 'Blue': return '#0070ba';
        case 'Red': return '#ea580c';
        case 'Yellow': return '#eab308';
        case 'Green': return '#16a34a';
        default: return '#000';
      }
    }
  </script>
</body>
</html>
